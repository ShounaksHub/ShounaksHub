<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="75%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyber-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.2" fill="#00F5D4" fill-opacity="0.3" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-pill {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .floating-pill-delay {
        animation: floatSlow 5s ease-in-out infinite;
        animation-delay: 2s;
      }
      .circuit-line {
        stroke-dasharray: 20, 10;
        animation: circuitFlow 12s linear infinite;
      }
      .scan-beam {
        animation: scanline 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cyber Grid Background -->
  <rect width="1200" height="360" rx="16" fill="url(#cyber-grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="140" fill="#00F5D4" fill-opacity="0.12" filter="url(#glow-cyan)" class="pulsing-orb" />
  <circle cx="1060" cy="280" r="180" fill="#8B5CF6" fill-opacity="0.16" filter="url(#glow-purple)" class="pulsing-orb" />
  <circle cx="600" cy="180" r="100" fill="#EC4899" fill-opacity="0.08" filter="url(#glow-purple)" class="pulsing-orb" />

  <!-- Glowing Circuit Lines -->
  <path d="M 0,220 L 240,220 L 300,280 L 520,280" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1.5" fill="none" class="circuit-line" />
  <circle cx="520" cy="280" r="3" fill="#00F5D4" />
  <path d="M 1200,100 L 980,100 L 920,50 L 750,50" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" fill="none" class="circuit-line" />
  <circle cx="750" cy="50" r="3" fill="#8B5CF6" />

  <!-- Top Decorative Bar / Terminal Dots -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
    <circle cx="16" cy="0" r="5" fill="#F59E0B" />
    <circle cx="32" cy="0" r="5" fill="#10B981" />
    <text x="56" y="4" font-family="'Courier New', monospace" font-size="12" fill="#64748B" font-weight="600" letter-spacing="1.5">SHOUNAK-OS // v2.6.0_STABLE // SYSTEM_SECURE</text>
  </g>

  <!-- Status Indicator Badge (Top Right) -->
  <g transform="translate(980, 26)">
    <rect width="170" height="28" rx="14" fill="#0F172A" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#00F5D4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#00F5D4" letter-spacing="1">SYSTEMS ONLINE</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(60, 100)">

    <!-- Terminal Prompt Pre-title -->
    <text x="0" y="24" font-family="'Fira Code', 'Courier New', monospace" font-size="14" fill="#00F5D4" font-weight="600" letter-spacing="2">
      root@shounak:~$ whoami
    </text>

    <!-- Big Name Title -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#cyber-cyan-purple)" letter-spacing="-0.5" filter="url(#glow-cyan)">
      SHOUNAK SAHA
    </text>

    <!-- Subtitle / Role Description -->
    <text x="0" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
      CYBERSECURITY SPECIALIST <tspan fill="#00F5D4">•</tspan> AI/ML SYSTEMS <tspan fill="#8B5CF6">•</tspan> FULL-STACK ARCHITECT
    </text>

    <!-- University & Mission Tagline -->
    <text x="0" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B" letter-spacing="0.5">
      🏛️ Integrated B.Tech - M.Tech CSE (Cybersecurity) @ NFSU  |  🛡️ Building, Breaking &amp; Securing Scalable Systems
    </text>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 165)">
      <!-- Badge 1: Cybersecurity -->
      <g class="floating-pill">
        <rect width="180" height="34" rx="17" fill="url(#badge-bg)" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#00F5D4">🛡️ Threat Forensics</text>
      </g>

      <!-- Badge 2: AI Agents -->
      <g transform="translate(192, 0)" class="floating-pill-delay">
        <rect width="170" height="34" rx="17" fill="url(#badge-bg)" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#C084FC">🤖 AI &amp; Agents</text>
      </g>

      <!-- Badge 3: SIH 2026 Finalist -->
      <g transform="translate(374, 0)" class="floating-pill">
        <rect width="170" height="34" rx="17" fill="url(#badge-bg)" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F472B6">🏆 SIH 2026 Innovator</text>
      </g>

      <!-- Badge 4: Full Stack & Sports -->
      <g transform="translate(556, 0)" class="floating-pill-delay">
        <rect width="190" height="34" rx="17" fill="url(#badge-bg)" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">🏏 Sports &amp; WebGL Tech</text>
      </g>
    </g>

  </g>

  <!-- Right Side Cyber Terminal Graphic -->
  <g transform="translate(860, 95)" filter="url(#card-shadow)">
    <!-- Terminal Window Box -->
    <rect width="280" height="195" rx="12" fill="#0a0f1d" stroke="#1E293B" stroke-width="1.5" />
    <rect width="280" height="28" rx="12" fill="#131C31" />
    <!-- Terminal Header Buttons -->
    <circle cx="16" cy="14" r="4" fill="#EF4444" opacity="0.8" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" opacity="0.8" />
    <circle cx="40" cy="14" r="4" fill="#10B981" opacity="0.8" />
    <text x="56" y="18" font-family="'Fira Code', monospace" font-size="10" fill="#94A3B8" font-weight="600">shounak@nfsu-core</text>

    <!-- Terminal Code Lines -->
    <g transform="translate(16, 48)">
      <text x="0" y="0" font-family="'Fira Code', monospace" font-size="11" fill="#64748B">$ cat interests.json</text>
      
      <text x="0" y="18" font-family="'Fira Code', monospace" font-size="11" fill="#C084FC">{</text>
      <text x="12" y="34" font-family="'Fira Code', monospace" font-size="10.5" fill="#00F5D4">"security": <tspan fill="#F8FAFC">"Offensive &amp; Def"</tspan>,</text>
      <text x="12" y="50" font-family="'Fira Code', monospace" font-size="10.5" fill="#00F5D4">"ai_core": <tspan fill="#F8FAFC">"Autonomous Agents"</tspan>,</text>
      <text x="12" y="66" font-family="'Fira Code', monospace" font-size="10.5" fill="#00F5D4">"stack": <tspan fill="#F8FAFC">"Python • TS • C++"</tspan>,</text>
      <text x="12" y="82" font-family="'Fira Code', monospace" font-size="10.5" fill="#00F5D4">"passion": <tspan fill="#F8FAFC">"Cricket &amp; Analytics"</tspan>,</text>
      <text x="12" y="98" font-family="'Fira Code', monospace" font-size="10.5" fill="#00F5D4">"status": <tspan fill="#10B981">"Always Building 🚀"</tspan></text>
      <text x="0" y="114" font-family="'Fira Code', monospace" font-size="11" fill="#C084FC">}</text>

      <text x="0" y="132" font-family="'Fira Code', monospace" font-size="11" fill="#00F5D4">$ <tspan fill="#38BDF8">deploy</tspan> --target production</text>
      <!-- Blinking Cursor -->
      <rect x="185" y="122" width="7" height="12" fill="#00F5D4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Glowing bottom border beam -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#cyber-cyan-purple)" stroke-width="2" />
</svg>
