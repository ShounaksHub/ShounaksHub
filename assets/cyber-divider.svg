<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F5D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#EC4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
    <filter id="div-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#div-grad)" stroke-width="2" filter="url(#div-glow)"/>
  <polygon points="600,6 606,12 600,18 594,12" fill="#8B5CF6" filter="url(#div-glow)"/>
  <circle cx="450" cy="12" r="3" fill="#00F5D4" filter="url(#div-glow)"/>
  <circle cx="750" cy="12" r="3" fill="#EC4899" filter="url(#div-glow)"/>
</svg>